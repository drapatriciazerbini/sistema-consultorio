name: Publicar o sistema da Dra. Patricia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A chave publishable faz parte do frontend público. Nunca use service_role aqui.
      VITE_SUPABASE_URL: https://nvsxgvtwmcivdmrtpdqx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xX8jL729Yuns17JYaoD2JQ_sk-iwrc-
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar o projeto
        run: npm run lint

      - name: Gerar a versao de producao
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicacao
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # As Edge Functions nao faziam parte da publicacao. Por causa disso a funcao
  # rodando em producao ficou horas mais antiga que o codigo do repositorio, e o
  # sistema exibia um erro que ja estava corrigido aqui. Publicar as duas coisas
  # juntas impede que isso volte a acontecer.
  funcoes:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nvsxgvtwmcivdmrtpdqx
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Conferir se o token esta configurado
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN nao foi configurado nos secrets do repositorio. As Edge Functions nao serao publicadas."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar a CLI do Supabase
        if: steps.token.outputs.presente == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar as Edge Functions
        if: steps.token.outputs.presente == 'true'
        run: |
          supabase functions deploy whatsapp-send --project-ref "$PROJECT_REF"
          supabase functions deploy meta-webhook --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-dispatch --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reply --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reopen --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy transcrever-audio --project-ref "$PROJECT_REF"
          supabase functions deploy assinar-consulta --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-cancel --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-perfil --project-ref "$PROJECT_REF"
          supabase functions deploy memed-prescritor --project-ref "$PROJECT_REF"
          supabase functions deploy memed-receita --project-ref "$PROJECT_REF"

      # Aplica as migrations pendentes. Sem isto, toda alteracao de banco tem de
      # ser colada na mao no SQL Editor, o que ja causou schema publicado
      # diferente do repositorio.
      # Vai direto ao banco, sem "supabase link".
      #
      # O link pergunta a API da Supabase quem e o projeto, e para isso exige do
      # token de acesso permissoes que nada tem a ver com migration: chaves da
      # API, configuracao de autenticacao. Em 14/09/2026 o primeiro envio parou
      # exatamente ai, com "necessary privileges", embora o token ja pudesse
      # aplicar migrations. Em vez de abrir o token, tiramos a pergunta.
      #
      # O endereco e o do pooler em modo sessao porque a conexao direta do
      # Postgres so atende IPv6, e a maquina do GitHub so tem IPv4.
      - name: Aplicar migrations do banco
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD nao configurado. As migrations nao serao aplicadas automaticamente."
            exit 0
          fi
          # A senha entra dentro de uma URL: caractere especial precisa virar
          # codigo, senao a URL quebra no meio e o erro nao explica por que.
          SENHA=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          # Esconde tambem a versao codificada do log, que o GitHub nao mascara.
          echo "::add-mask::$SENHA"
          supabase db push --db-url "postgresql://postgres.$PROJECT_REF:$SENHA@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
