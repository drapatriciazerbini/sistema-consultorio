    <!-- Icone da aba e do atalho no celular, feito a partir do monograma PZ
         (23/09/2026). Sem ele a aba mostrava o globo em branco do navegador, e

    <link rel="icon" href="./favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icone-32.png?v=3" />

    <!--
      Manifesto em todo aparelho (02/10/2026, pedido do Edu para a Dra.
      Patricia): no computador o Chrome passa a oferecer "Instalar app", e o
      app instalado abre em janela propria, com icone na barra de tarefas, e
      pede a permissao das notificacoes com mais facilidade do que a aba.
      Ate aqui o manifesto so entrava no celular (decisao de 21/09 no sistema
      do Dr. Marcello, que continua assim la).

      NAO existe cache no service worker (public/sw.js), e e de proposito: ele
      so recebe as notificacoes. Sem cache o app sempre busca o que esta no
      ar depois de cada publicacao.
    -->
    <link rel="manifest" href="./manifest.json?v=3" />
